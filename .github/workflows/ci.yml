name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Lint and formatting run once on the dev-toolchain floor. ESLint 9 requires
  # Node >= 20.19, which is newer than the package's runtime floor (see below).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Run both checks even when the first fails, so a formatting slip doesn't
      # hide lint errors (and vice versa) behind a single red step. `!cancelled`
      # still short-circuits if `npm ci` itself fails.
      - name: Prettier
        id: format
        run: npm run format:check
      - name: ESLint
        if: ${{ !cancelled() && steps.format.outcome != 'skipped' }}
        run: npm run lint

  # The published tool supports Node >= 18 (its runtime deps do), so prove
  # typecheck/tests/build pass across the whole supported range.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
